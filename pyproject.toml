[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gs_simulation"
version = "0.1.0"
description = "Grey systems analysis: methods, models, and simulation. Reference implementation following Sifeng Liu (2024)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Danlin Yu", email = "danlinyu@gmail.com" },
]
keywords = ["grey-system", "grey-relational-analysis", "GM(1,1)", "time-series", "small-sample", "uncertain-systems"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.8",
]
examples = [
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[project.urls]
"Homepage" = "https://github.com/danlinyu/gs_simulation"
"Repository" = "https://github.com/danlinyu/gs_simulation"
"Issues" = "https://github.com/danlinyu/gs_simulation/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests that take more than 5 seconds",
    "book_example: marks tests that reproduce a worked example from Liu (2024)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
